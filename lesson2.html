<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Запрет любых запросов в сеть -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; frame-src 'self' data: blob: about:">
<title>Урок 2. Структура сайта: голова и тело</title>
<style>
/* ===== Основа ===== */
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
:root { --panel: 520px; --ink: #14213d; --blue: #1257c9; --green: #17803a; --red: #c62828; --yellow: #ffd23f; --violet: #6a1b9a; }
html, body { height: 100%; overflow: hidden; }
body { font: 20px/1.35 "Segoe UI", Arial, sans-serif; color: var(--ink); background: #8fd3ff; user-select: none; -webkit-user-select: none; }
button, input, textarea { font: inherit; color: inherit; }
button { min-height: 56px; padding: 8px 20px; border: 3px solid var(--ink); border-radius: 14px; background: #fff; font-weight: 700; cursor: pointer; box-shadow: 0 4px 0 var(--ink); }
button:hover:not(:disabled) { background: #fff6cc; }
button:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
button:disabled { opacity: .55; cursor: default; }
button.primary { background: var(--blue); color: #fff; }
button.primary:hover:not(:disabled) { background: #0d469f; }
button.big { min-height: 66px; font-size: 24px; }
:focus-visible { outline: 5px solid #ff7a00; outline-offset: 3px; }
code { font-family: Consolas, "Courier New", monospace; font-weight: 700; }

/* ===== 3D-сцена и запасная 2D-сцена ===== */
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#flat { position: fixed; top: 0; bottom: 0; right: 0; left: var(--panel); padding: 90px 16px 16px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 16px; background: linear-gradient(#8fd3ff 65%, #63c74d 65%); overflow: hidden; }
#flat .notice { background: #fff; border: 4px solid var(--red); border-radius: 14px; padding: 12px 16px; font-weight: 700; text-align: center; }
#flat .stagebox { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; font-size: 22px; text-align: center; width: 100%; }
#flat .robot { font-size: 80px; line-height: 1; }
#flat .robot.jump { animation: jump .5s ease 3; }
#flat .robot.confused { animation: spin .7s ease 2; }
#flat .city { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; min-height: 60px; }
#flat .city span { background: #fff; border: 3px solid var(--ink); border-radius: 12px; padding: 6px 12px; animation: drop .4s ease; font-weight: 700; }
@keyframes jump { 50% { transform: translateY(-40px); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes drop { from { transform: translateY(-60px); opacity: 0; } }
/* Дом в простой версии */
.house2d { width: min(520px, 100%); border: 4px solid var(--ink); border-radius: 12px; background: #fff3d6; overflow: hidden; }
.house2d .roof { background: #e53935; color: #fff; padding: 8px; font-weight: 800; clip-path: polygon(12% 0, 88% 0, 100% 100%, 0 100%); }
.house2d .roof code { color: #fff; }
.house2d .part { min-height: 90px; border-top: 4px solid var(--ink); padding: 6px; }
.house2d .part.head { background: #efe6ff; }
.house2d .part.body { background: #e6f8ea; min-height: 120px; }
.house2d .cap { font-weight: 800; }
.house2d .things { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; padding-top: 4px; }
.house2d .thing { background: #fff; border: 2px solid var(--ink); border-radius: 10px; padding: 2px 8px; animation: drop .4s ease; }
.house2d.lit, .house2d .part.lit { box-shadow: inset 0 0 0 6px #ffb300; background: #fff6cc; }
.sign2d { background: var(--blue); color: #fff; font-weight: 800; padding: 4px; animation: drop .4s ease; }

/* ===== Верхняя полоса: таймер, звук ===== */
#hud { position: fixed; top: 10px; right: 10px; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; max-width: calc(100% - var(--panel) - 20px); z-index: 5; }
#timer { background: #fff; border: 3px solid var(--ink); border-radius: 14px; padding: 6px 14px; font-weight: 700; min-height: 56px; display: flex; flex-direction: column; justify-content: center; }
#timer.over { background: var(--yellow); }
#hud button { padding: 6px 14px; }

/* ===== Джойстик и кнопка «Взять» поверх 3D ===== */
#controls { position: fixed; right: 18px; bottom: 18px; display: flex; align-items: flex-end; gap: 18px; z-index: 5; }
#act { width: 130px; height: 130px; border-radius: 50%; font-size: 22px; line-height: 1.15; padding: 6px; background: var(--yellow); }
#pad { width: 170px; height: 170px; border-radius: 50%; background: rgba(255,255,255,.55); border: 4px solid var(--ink); position: relative; touch-action: none; cursor: grab; }
#pad .knob { position: absolute; left: 50%; top: 50%; width: 74px; height: 74px; margin: -37px 0 0 -37px; border-radius: 50%; background: var(--blue); border: 4px solid var(--ink); pointer-events: none; }
#pad .arrows { position: absolute; inset: 6px; pointer-events: none; font-size: 20px; font-weight: 800; }
#pad .arrows span { position: absolute; }
#pad .arrows .u { top: 0; left: 50%; transform: translateX(-50%); }
#pad .arrows .d { bottom: 0; left: 50%; transform: translateX(-50%); }
#pad .arrows .l { left: 2px; top: 50%; transform: translateY(-50%); }
#pad .arrows .r { right: 2px; top: 50%; transform: translateY(-50%); }

/* ===== Панель заданий (слева) ===== */
#panel { position: fixed; top: 0; left: 0; bottom: 0; width: var(--panel); background: rgba(255,255,255,.96); border-right: 4px solid var(--ink); padding: 14px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; z-index: 4; }
#panel > * { flex: none; }
#panel h1 { font-size: 28px; line-height: 1.15; }
#panel h2 { font-size: 24px; line-height: 1.2; }
body.game { --panel: 420px; }
body.game #panel { gap: 9px; padding: 10px 14px; }
.bubble { display: flex; gap: 12px; align-items: flex-start; background: #e4f1ff; border: 3px solid var(--blue); border-radius: 16px; padding: 12px 14px; font-weight: 600; }
.bubble .who { flex: none; background: var(--blue); color: #fff; border-radius: 10px; padding: 2px 10px; }
.bubble.good { background: #e3f8e6; border-color: var(--green); }
.bubble.good .who { background: var(--green); }
.bubble.bad { background: #fff1e0; border-color: #b85c00; }
.bubble.bad .who { background: #b85c00; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.row.end { justify-content: flex-end; }
.col { display: flex; flex-direction: column; gap: 10px; }
.spacer { flex: 1; }
.input { width: 100%; min-height: 60px; padding: 8px 16px; border: 3px solid var(--ink); border-radius: 14px; font-size: 26px; user-select: text; -webkit-user-select: text; }
.note { font-weight: 700; color: var(--red); min-height: 1.35em; }
.tip { background: #fff6cc; border: 3px solid #b88a00; border-radius: 12px; padding: 8px 12px; font-weight: 600; }
.task { font-weight: 700; }
.help { font-size: 20px; color: #39465f; }
.stars { font-size: 30px; letter-spacing: 3px; color: #8a6d00; white-space: nowrap; }
.stars.got { color: #c77700; font-size: 44px; }

/* Ответы с выбором */
.answers button { text-align: left; }
.answers button.code-btn { font-size: 22px; }
.answers button.right { background: #c9f0d0; opacity: 1; border-color: var(--green); }
.answers button.right::after { content: "  ✔"; }

/* Скелет страницы: строки подсвечивают части дома */
.skeleton { background: var(--ink); color: #fff; border-radius: 14px; padding: 8px 0; font: 700 21px/1.25 Consolas, "Courier New", monospace; }
.skeleton .line { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 3px 10px; border-left: 8px solid transparent; cursor: pointer; }
.skeleton .line .mark { font: 700 16px "Segoe UI", Arial, sans-serif; opacity: .9; white-space: nowrap; }
.skeleton .line.html { border-left-color: #ff8a80; } .skeleton .line.html .code { color: #ff9d9d; }
.skeleton .line.head { border-left-color: #d1a6ff; } .skeleton .line.head .code { color: #e2c6ff; }
.skeleton .line.body { border-left-color: #8ef0a5; } .skeleton .line.body .code { color: #a8f5bb; }
.skeleton .line:hover, .skeleton .line:focus { background: #33406a; }
.skeleton .line:focus-visible { outline-offset: -3px; }

/* Игра */
.legend { display: flex; flex-direction: column; gap: 6px; }
.zone { border: 3px solid; border-radius: 12px; padding: 4px 10px; font-weight: 600; line-height: 1.25; }
.zone.head { border-color: var(--violet); background: #f3e8ff; }
.zone.body { border-color: var(--green); background: #e3f8e6; }
.status { font-weight: 700; }
.progress { font-weight: 700; background: #f1f4fb; border-radius: 10px; padding: 4px 10px; }
.thing-card { border: 4px solid var(--ink); border-radius: 16px; background: var(--yellow); text-align: center; padding: 10px; font-size: 26px; font-weight: 800; }
.thing-card .big { font-size: 56px; line-height: 1.1; }
.thing-card code { color: var(--blue); }
.zone-btn { flex: 1; }
.zone-btn.head { background: #f3e8ff; border-color: var(--violet); }
.zone-btn.body { background: #e3f8e6; border-color: var(--green); }

/* ===== Песочница: панель почти на весь экран, справа полоска с 3D ===== */
body.sandbox { --panel: calc(100% - 250px); }
body.sandbox #panel { gap: 8px; padding: 10px 14px; }
@media (min-width: 900px) { body.sandbox #hud { top: auto; bottom: 10px; } }
body.sandbox #panel > .sandbox { flex: 1; min-height: 300px; }
body.sandbox #flat { padding-top: 200px; }
body.sandbox #flat .robot { font-size: 60px; }
body.sandbox #flat .stagebox, body.sandbox #flat .notice { font-size: 16px; }
.sb-head { display: flex; align-items: center; gap: 12px; }
.sb-head h1 { font-size: 26px !important; }
.sandbox { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: minmax(0, 1fr); gap: 12px; }
.sandbox .col { min-width: 0; min-height: 0; gap: 6px; }
.sandbox .col > .bubble, .sandbox .col > .cap, .sandbox .col > .plan { flex: none; }
.cap { font-weight: 700; font-size: 20px; }
.editor { flex: 1; width: 100%; min-height: 150px; resize: none; padding: 8px 10px; border: 3px solid var(--ink); border-radius: 12px; background: var(--ink); color: #fff; font: 20px/1.4 Consolas, "Courier New", monospace; tab-size: 2; white-space: pre; overflow: auto; user-select: text; -webkit-user-select: text; }
.browser { flex: 1 1 auto; min-height: 120px; display: flex; flex-direction: column; border: 3px solid var(--ink); border-radius: 12px; overflow: hidden; background: #dfe5f0; }
.tabbar { display: flex; align-items: flex-end; gap: 6px; padding: 6px 8px 0; background: #c3ccdc; }
.tab { max-width: calc(100% - 30px); background: #fff; border: 2px solid #7b879e; border-bottom: 0; border-radius: 10px 10px 0 0; padding: 4px 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tab.empty .tab-text { color: #5d6880; font-style: italic; font-weight: 600; }
.tab-plus { font-weight: 800; color: #39465f; padding: 0 4px 4px; }
.addr { background: #fff; margin: 0; padding: 3px 12px; border-top: 2px solid #7b879e; border-bottom: 2px solid #7b879e; font-size: 18px; color: #39465f; }
.result { flex: 1; width: 100%; min-height: 70px; border: 0; background: #fff; }
.hintcode { flex: 0 1 auto; min-height: 64px; overflow: auto; margin: 0; padding: 6px 10px; background: #fff6cc; border: 3px solid #b88a00; border-radius: 12px; font: 700 18px/1.3 Consolas, "Courier New", monospace; white-space: pre; user-select: text; -webkit-user-select: text; }
.actions button { padding: 8px 14px; }
.actions .help { font-size: 18px; }
/* План-картинка финального вызова */
.plan { flex: none; border: 3px dashed var(--blue); border-radius: 12px; padding: 6px; background: #f1f4fb; font-size: 18px; font-weight: 700; }
.plan-tab { display: inline-block; background: #fff; border: 2px solid #7b879e; border-bottom: 0; border-radius: 10px 10px 0 0; padding: 2px 10px; color: var(--violet); }
.plan-page { background: #fff; border: 2px solid #7b879e; border-radius: 0 10px 10px 10px; padding: 4px 10px; }
.plan-h1 { font-size: 24px; font-weight: 800; color: var(--green); overflow-wrap: anywhere; }
.plan-p { color: var(--green); }
#flat .city span.neon { background: var(--ink); color: #ffe45c; }

/* ===== Итоги, вопросы, сертификат ===== */
.words { flex: none; display: grid; grid-template-columns: auto 1fr; gap: 0 12px; line-height: 1.25; border: 3px solid var(--ink); border-radius: 14px; padding: 4px 12px; }
.words dt { font: 700 20px Consolas, "Segoe UI", monospace; }
.score { display: flex; flex-direction: column; gap: 2px; }
.score .stars { font-size: 24px; }
.cert { flex: 1 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 4px; padding: 12px 24px; background: #fffdf2; border: 10px double #b88a00; border-radius: 12px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.cert .big { font-size: 30px; font-weight: 800; letter-spacing: 6px; line-height: 1.15; }
.cert .title { font-size: 32px; font-weight: 800; color: var(--blue); line-height: 1.15; }
.cert .name { font-size: 38px; font-weight: 800; border-bottom: 3px solid var(--ink); padding: 0 30px; max-width: 100%; overflow-wrap: anywhere; line-height: 1.2; }
.cert .gold { font-size: 26px; font-weight: 700; color: #8a5a00; }
.cert .foot { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; gap: 12px; text-align: left; }
.seal { flex: none; width: 112px; height: 112px; border-radius: 50%; border: 5px double var(--blue); color: var(--blue); display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; line-height: 1.15; text-align: center; transform: rotate(-12deg); }
.seal b { font-size: 28px; }

/* ===== Окна поверх всего ===== */
.overlay { position: fixed; inset: 0; background: rgba(10,20,45,.6); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 12px; }
.dialog { background: #fff; border: 4px solid var(--ink); border-radius: 20px; padding: 20px; width: min(760px, 100%); max-height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.dialog ul { padding-left: 26px; }
.dialog .time { font-size: 34px; font-weight: 800; }

@media print {
  @page { size: A4 landscape; margin: 10mm; }
  #scene, #flat, #hud, #controls, .overlay, .no-print { display: none !important; }
  html, body { height: auto; overflow: visible; background: #fff; }
  #panel { position: static !important; width: 100% !important; height: auto; border: 0 !important; padding: 0 !important; overflow: visible !important; background: #fff; }
  .cert { height: 180mm; gap: 4mm; }
  .cert > div { font-size: 28px; }
  .cert .big { font-size: 48px; }
  .cert .title { font-size: 54px; }
  .cert .name { font-size: 60px; }
  .cert .gold { font-size: 36px; }
  .cert .foot { font-size: 24px; padding: 0 6mm; margin-top: 8mm; }
}

/* Узкий экран (планшет вертикально): панель снизу */
@media (max-width: 899px) {
  #panel { top: 45%; right: 0; width: 100%; border-right: 0; border-top: 4px solid var(--ink); }
  body.game #panel { top: 58%; }
  #hud { max-width: calc(100% - 20px); }
  #flat { left: 0; bottom: 55%; padding-top: 80px; }
  #controls { bottom: calc(42% + 12px); }
  #act { width: 110px; height: 110px; }
  #pad { width: 140px; height: 140px; }
  body.sandbox #panel { top: 0; }
  body.sandbox #hud { display: none; }
  body.sandbox #panel > .sandbox { flex: none; }
  .sandbox { grid-template-columns: 1fr; grid-template-rows: auto; }
  .hintcode { flex: none; }
  .editor { min-height: 260px; }
  .browser { min-height: 260px; }
}
@media (max-width: 1100px) and (min-width: 900px) { :root { --panel: 470px; } body.game { --panel: 390px; } }
@media (max-height: 640px) and (min-width: 900px) {
  #panel h1 { font-size: 26px; }
  body.game #panel { gap: 7px; }
  #panel { gap: 8px; padding: 10px 16px; }
  .skeleton { font-size: 20px; padding: 4px 0; }
  .skeleton .line { padding: 1px 10px; }
  .bubble { padding: 8px 12px; }
}
</style>
</head>
<body>
<canvas id="scene" aria-label="3D-мир: дом с чердаком и робот Бит"></canvas>
<div id="flat" hidden></div>
<div id="hud">
  <div id="timer" role="timer"></div>
  <button id="btn-timer" type="button">⏱ Скрыть</button>
  <button id="btn-sound" type="button">🔊 Звук</button>
</div>
<div id="controls" hidden>
  <button id="act" type="button">✋ Взять</button>
  <div id="pad" role="img" aria-label="Джойстик: тяни, чтобы идти"><div class="arrows"><span class="u">▲</span><span class="d">▼</span><span class="l">◀</span><span class="r">▶</span></div><div class="knob"></div></div>
</div>
<main id="panel" aria-live="polite"></main>
<noscript><p style="position:fixed;inset:0;background:#fff;padding:30px">Включи JavaScript в браузере.</p></noscript>
