<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Запрет любых запросов в сеть -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:">
<title>Урок 1. Что такое код? Знакомство с HTML</title>
<style>
/* ===== Основа ===== */
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
:root { --panel: 580px; --ink: #14213d; --blue: #1257c9; --green: #17803a; --red: #c62828; --yellow: #ffd23f; }
html, body { height: 100%; overflow: hidden; }
body { font: 20px/1.35 "Segoe UI", Arial, sans-serif; color: var(--ink); background: #8fd3ff; user-select: none; -webkit-user-select: none; }
button, input { font: inherit; color: inherit; }
button { min-height: 56px; padding: 8px 20px; border: 3px solid var(--ink); border-radius: 14px; background: #fff; font-weight: 700; cursor: pointer; box-shadow: 0 4px 0 var(--ink); }
button:hover:not(:disabled) { background: #fff6cc; }
button:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
button:disabled { opacity: .55; cursor: default; }
button.primary { background: var(--blue); color: #fff; }
button.primary:hover:not(:disabled) { background: #0d469f; }
:focus-visible { outline: 5px solid #ff7a00; outline-offset: 3px; }

/* ===== 3D-сцена и запасная 2D-сцена ===== */
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#flat { position: fixed; top: 0; bottom: 0; left: 0; right: var(--panel); padding: 90px 16px 16px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 16px; background: linear-gradient(#8fd3ff 65%, #63c74d 65%); overflow: hidden; }
#flat .notice { background: #fff; border: 4px solid var(--red); border-radius: 14px; padding: 12px 16px; font-weight: 700; text-align: center; }
#flat .stagebox { min-height: 200px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; font-size: 24px; text-align: center; }
#flat .robot { font-size: 90px; line-height: 1; }
#flat .robot.jump { animation: jump .5s ease 3; }
#flat .robot.confused { animation: spin .7s ease 2; }
#flat .city { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; min-height: 80px; }
#flat .city span { background: #fff; border: 3px solid var(--ink); border-radius: 12px; padding: 6px 12px; animation: drop .4s ease; font-weight: 700; }
.layer { border: 3px solid var(--ink); border-radius: 8px; padding: 2px 18px; font-weight: 700; animation: drop .4s ease; }
@keyframes jump { 50% { transform: translateY(-40px); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes drop { from { transform: translateY(-60px); opacity: 0; } }

/* ===== Верхняя полоса: этап, таймер, звук ===== */
#hud { position: fixed; top: 10px; left: 10px; display: flex; flex-wrap: wrap; gap: 8px; max-width: calc(100% - var(--panel) - 20px); z-index: 5; }
#timer { background: #fff; border: 3px solid var(--ink); border-radius: 14px; padding: 6px 14px; font-weight: 700; min-height: 56px; display: flex; flex-direction: column; justify-content: center; }
#timer.over { background: var(--yellow); }
#hud button { padding: 6px 14px; }

/* ===== Панель заданий ===== */
#panel { position: fixed; top: 0; right: 0; bottom: 0; width: var(--panel); background: rgba(255,255,255,.96); border-left: 4px solid var(--ink); padding: 14px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; z-index: 4; }
#panel h1 { font-size: 28px; line-height: 1.15; }
#panel h2 { font-size: 24px; line-height: 1.2; }
.bubble { display: flex; gap: 12px; align-items: flex-start; background: #e4f1ff; border: 3px solid var(--blue); border-radius: 16px; padding: 12px 14px; font-weight: 600; }
.bubble .who { flex: none; background: var(--blue); color: #fff; border-radius: 10px; padding: 2px 10px; }
.bubble.good { background: #e3f8e6; border-color: var(--green); }
.bubble.good .who { background: var(--green); }
.bubble.bad { background: #fff1e0; border-color: #b85c00; }
.bubble.bad .who { background: #b85c00; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.row.end { justify-content: flex-end; }
.spacer { flex: 1; }
.example { background: var(--ink); color: #fff; border-radius: 14px; padding: 14px; font: 700 24px/1.5 Consolas, "Courier New", monospace; text-align: center; }
.example .t1 { color: #ff9d9d; } .example .t2 { color: #9fd0ff; }
.input { width: 100%; min-height: 60px; padding: 8px 16px; border: 3px solid var(--ink); border-radius: 14px; font-size: 26px; user-select: text; -webkit-user-select: text; }
.note { font-weight: 700; color: var(--red); min-height: 1.35em; }

/* ===== Перетаскивание ===== */
.board { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
.board.solo { grid-template-columns: 1fr; }
.board.solo > .col:first-child { display: none; }
.col { display: flex; flex-direction: column; gap: 10px; }
.col .cap { font-weight: 700; text-align: center; }
.slot { min-height: 66px; border: 3px dashed #52618a; border-radius: 14px; background: #f1f4fb; display: flex; align-items: center; gap: 8px; padding: 3px 6px; cursor: pointer; }
.slot .num { flex: none; font-weight: 700; min-width: 28px; text-align: center; }
.slot .hint { color: #46557c; }
.slot.filled { border-style: solid; }
.slot.locked { border-color: var(--green); background: #e3f8e6; cursor: default; }
.slot.over { background: #fff3b0; border-color: #b85c00; }
.pool { display: flex; flex-direction: column; gap: 10px; min-height: 66px; border-radius: 14px; }
.pool.wide { flex-direction: row; flex-wrap: wrap; justify-content: center; }
.card { flex: 1; text-align: left; background: var(--yellow); touch-action: none; display: flex; align-items: center; gap: 8px; padding: 6px 12px; line-height: 1.2; }
.card:hover:not(:disabled) { background: #ffe485; }
.pool .card { flex: none; }
.card.code { font-family: Consolas, "Courier New", monospace; font-size: 24px; }
.card.selected { background: #9fe3ff !important; outline: 5px solid var(--blue); }
.card.selected::before { content: "👉"; }
.card:disabled { opacity: 1; background: #c9f0d0; }
.card.ghost { position: fixed; z-index: 50; pointer-events: none; margin: 0; opacity: .95; transform: rotate(-2deg); }
.card.lifted { opacity: .25; }
.slot.shake { animation: shake .4s ease; }
@keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.card.running { outline: 5px solid #ff7a00; }

/* Показ «как увидит браузер» */
.preview { border: 3px solid var(--ink); border-radius: 14px; background: #fff; padding: 8px 14px; }
.preview .cap { font-size: 20px; font-weight: 700; color: #46557c; }

/* ===== Песочница ===== */
body.sandbox { --panel: calc(100% - 250px); }
body.sandbox #panel { gap: 8px; padding: 10px 14px; }
@media (min-width: 900px) { body.sandbox #hud { top: auto; bottom: 10px; } }
body.sandbox #panel > * { flex: none; }
body.sandbox #panel > .sandbox { flex: 1; min-height: 190px; }
.sandbox { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.sandbox .col { min-width: 0; min-height: 0; gap: 4px; }
.sandbox .cap { text-align: left; }
.editor { flex: 1; width: 100%; min-height: 80px; resize: none; padding: 8px 10px; border: 3px solid var(--ink); border-radius: 12px; background: var(--ink); color: #fff; font: 20px/1.5 Consolas, "Courier New", monospace; user-select: text; -webkit-user-select: text; }
.result { flex: 1; width: 100%; min-height: 80px; border: 3px solid var(--ink); border-radius: 12px; background: #fff; }
.keys { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-bottom: 4px; }
.keys .key { padding: 4px 10px; font-family: Consolas, "Courier New", monospace; }
.task { font-weight: 700; background: #fff6cc; border: 3px solid #b88a00; border-radius: 12px; padding: 6px 12px; }
.stars { font-size: 30px; letter-spacing: 3px; color: #8a6d00; white-space: nowrap; }
.stars.got { color: #c77700; }
.actions button { padding: 8px 14px; }
body.sandbox #flat { padding-top: 220px; }
body.sandbox #flat .robot { font-size: 60px; }

/* ===== Итоги, вопросы, сертификат ===== */
.words { flex: none; display: grid; grid-template-columns: auto 1fr; gap: 0 12px; line-height: 1.25; border: 3px solid var(--ink); border-radius: 14px; padding: 4px 12px; }
.words dt { font: 700 20px Consolas, "Segoe UI", monospace; }
.score { display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: center; }
.score .stars { font-size: 24px; }
.answers button { text-align: left; }
.answers button.right { background: #c9f0d0; opacity: 1; }
.cert { flex: 1 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 4px; padding: 12px 24px; background: #fffdf2; border: 10px double #b88a00; border-radius: 12px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.cert .big { font-size: 30px; font-weight: 800; letter-spacing: 6px; line-height: 1.15; }
.cert .title { font-size: 34px; font-weight: 800; color: var(--blue); line-height: 1.15; }
.cert .name { font-size: 38px; font-weight: 800; border-bottom: 3px solid var(--ink); padding: 0 30px; max-width: 100%; overflow-wrap: anywhere; line-height: 1.2; }
.cert .gold { font-size: 26px; font-weight: 700; color: #8a5a00; }
.cert .foot { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; gap: 12px; text-align: left; }
.seal { flex: none; width: 112px; height: 112px; border-radius: 50%; border: 5px double var(--blue); color: var(--blue); display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; line-height: 1.15; text-align: center; transform: rotate(-12deg); }
.seal b { font-size: 28px; }

@media print {
  @page { size: A4 landscape; margin: 10mm; }
  #scene, #flat, #hud, .overlay, .no-print { display: none !important; }
  html, body { height: auto; overflow: visible; background: #fff; }
  #panel { position: static !important; width: 100% !important; height: auto; border: 0 !important; padding: 0 !important; overflow: visible !important; background: #fff; }
  .cert { height: 180mm; gap: 4mm; }
  .cert > div { font-size: 28px; }
  .cert .big { font-size: 48px; }
  .cert .title { font-size: 56px; }
  .cert .name { font-size: 60px; }
  .cert .gold { font-size: 36px; }
  .cert .foot { font-size: 24px; padding: 0 6mm; margin-top: 8mm; }
}

/* ===== Окна поверх всего ===== */
.overlay { position: fixed; inset: 0; background: rgba(10,20,45,.6); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 12px; }
.dialog { background: #fff; border: 4px solid var(--ink); border-radius: 20px; padding: 20px; width: min(760px, 100%); max-height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.dialog ul { padding-left: 26px; }
.dialog .time { font-size: 34px; font-weight: 800; }

/* Узкий экран (планшет вертикально): панель снизу */
@media (max-width: 899px) {
  #panel { top: 40%; left: 0; width: 100%; border-left: 0; border-top: 4px solid var(--ink); }
  #hud { max-width: calc(100% - 20px); }
  #flat { right: 0; bottom: 60%; padding-top: 80px; }
  body.sandbox #panel { top: 20%; }
  .sandbox { grid-template-columns: 1fr; }
}
@media (max-width: 1100px) and (min-width: 900px) { :root { --panel: 560px; } }
</style>
</head>
<body>
<canvas id="scene" aria-label="3D-город и робот Бит"></canvas>
<div id="flat" hidden></div>
<div id="hud">
  <div id="timer" role="timer"></div>
  <button id="btn-timer" type="button">⏱ Скрыть</button>
  <button id="btn-sound" type="button">🔊 Звук</button>
</div>
<main id="panel" aria-live="polite"></main>
<noscript><p style="position:fixed;inset:0;background:#fff;padding:30px">Включи JavaScript в браузере.</p></noscript>
